name: Build and regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run regression checks
        run: bash gradlew build --no-daemon --console=plain
      - name: Upload add-on JAR
        uses: actions/upload-artifact@v4
        with:
          name: VolytraFly
          path: build/libs/*.jar
          if-no-files-found: error
