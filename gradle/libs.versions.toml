[versions]
mod-version = "0.1.0"

# Fabric (https://fabricmc.net/develop)
# Still unobfuscated (Mojang's official names directly) as of 26.2, so there is still no
# separate Yarn mappings artifact - see https://fabricmc.net/2026/06/15/262.html
minecraft = "26.2"
fabric-loader = "0.19.3"

# Loom (https://github.com/FabricMC/fabric-loom)
# Fabric's own recommendation for the 26.2 line at time of writing. Double check
# https://fabricmc.net/develop for a newer patch before you build.
loom = "1.17-SNAPSHOT"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
# Meteor's 26.2 build is out (see https://meteorclient.com/), but double check
# https://maven.meteordev.org/#/releases/meteordevelopment/meteor-client for the exact
# artifact version string before you build - it may not follow "26.2-SNAPSHOT" exactly.
meteor = "26.2-SNAPSHOT"

# Mods

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Mods

[plugins]
# Non-obfuscated versions (26.1+, including 26.2) use the "net.fabricmc.fabric-loom" plugin id, which does
# not remap Minecraft or mods at all. The legacy "fabric-loom" id is only for backwards
# compatibility with obfuscated versions (1.21.11 and older).
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
