[versions]
mod-version = "0.1.0"

# Fabric (https://fabricmc.net/develop)
# 26.1.2 ships unobfuscated (Mojang's official names directly), so there is no
# separate Yarn mappings artifact anymore - see https://fabricmc.net/2026/03/14/261.html
minecraft = "26.1.2"
fabric-loader = "0.18.4"

# Loom (https://github.com/FabricMC/fabric-loom)
# Fabric's own recommendation for the 26.1.x line at time of writing. Double check
# https://fabricmc.net/develop for a newer patch before you build.
loom = "1.15-SNAPSHOT"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
meteor = "26.1.2-SNAPSHOT"

# Mods

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Mods

[plugins]
# Non-obfuscated versions (26.1+) use the "net.fabricmc.fabric-loom" plugin id, which does
# not remap Minecraft or mods at all. The legacy "fabric-loom" id is only for backwards
# compatibility with obfuscated versions (1.21.11 and older).
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
